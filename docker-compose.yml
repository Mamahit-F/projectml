version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studentinsight-postgres
    restart: always
    environment:
      POSTGRES_DB: studentinsight_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: studentinsight-ml-service
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - API_SECRET_KEY=studentinsight-ml-secret-key-2026
      - HISTORICAL_DATA_DIR=/data/historical
      - ML_ARTIFACTS_DIR=/app/artifacts
    volumes:
      - ../Data Poin Mahasiswa:/data/historical:ro
      - ./ml-service/artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studentinsight-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/studentinsight_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - ML_SERVICE_URL=http://ml-service:8001
      - ML_SERVICE_API_KEY=studentinsight-ml-secret-key-2026
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studentinsight-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
