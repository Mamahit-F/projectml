server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: studentinsight-backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 30MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studentinsight_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  bootstrap:
    default-user:
      enabled: ${APP_BOOTSTRAP_DEFAULT_USER_ENABLED:true}
      username: ${APP_BOOTSTRAP_DEFAULT_USER_USERNAME:user}
      email: ${APP_BOOTSTRAP_DEFAULT_USER_EMAIL:user@unklab.ac.id}
      password: ${APP_BOOTSTRAP_DEFAULT_USER_PASSWORD:password}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  ml:
    service-url: ${ML_SERVICE_URL:http://localhost:8001}
    api-key: ${ML_SERVICE_API_KEY:}
    timeout-ms: 120000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.studentinsight: ${APP_LOG_LEVEL:INFO}
    org.springframework.security: INFO
